name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish, for example v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package contents and hashes
        shell: powershell
        run: .\Verify-Package.ps1
      - name: Zip and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          name="HP2VR-${TAG}"
          git archive --format=zip --prefix="$name/" -o "$name.zip" HEAD
          gh release create "$TAG" "$name.zip" --target "$GITHUB_SHA" --title "HP2VR $TAG" --notes-file CHANGELOG.md --prerelease
